services:
  - type: web
    name: namovation
    runtime: docker
    plan: free
    region: oregon
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: namovation-db
          property: connectionString
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: INITIAL_ADMIN_SETUP_TOKEN
        generateValue: true

databases:
  - name: namovation-db
    databaseName: Namovation
    user: namovation
    plan: free
    region: oregon
